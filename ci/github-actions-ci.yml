name: OMNIS Continuous Integration & Verification

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-verify:
    name: Frontend TypeScript, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Validation
        run: npm run typecheck

      - name: Run Frontend Unit & Integration Tests
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build

      - name: Dependency Security Audit
        run: npm audit --audit-level=critical || true

  backend-verify:
    name: Python FastAPI Backend & Simulation Engine Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend & Numerical Simulation Pytest Suite
        working-directory: backend
        run: pytest -v
